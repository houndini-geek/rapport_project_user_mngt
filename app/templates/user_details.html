<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amara Osei · Rapport</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
  
</head>
<body>

<header class="topbar">
  <div class="brand">Rapport</div>
  <nav>
    <a href="index.html">Users</a>
    <a href="user-create.html">New user</a>
  </nav>
  <div class="who">
    <span class="who-name">Amara Osei</span>
    <a href="#" style="color:var(--muted);text-decoration:none;font-size:13px;">Sign out</a>
  </div>
</header>

<main class="container">
  <a class="back" href="index.html">← All users</a>

  <form class="config-panel" action="#" method="post">
    <div class="config-header">
      <div>
        <h1>Amara Osei</h1>
        <div class="meta">User #1 · <span class="mono">aosei</span></div>
      </div>
      <span class="pill pill-on">Active</span>
    </div>

    <div class="config-row">
      <div class="label">Logon name <small>Unique identifier</small></div>
      <div class="control">
        <input type="text" name="logon_name" value="aosei" maxlength="80">
      </div>
    </div>

    <div class="config-row">
      <div class="label">Display name</div>
      <div class="control">
        <input type="text" name="display_name" value="Amara Osei" maxlength="150">
      </div>
    </div>

    <div class="config-row">
      <div class="label">Department</div>
      <div class="control">
        <input type="text" name="department" value="Operations" maxlength="100">
      </div>
    </div>

    <div class="config-row">
      <div class="label">Site name</div>
      <div class="control">
        <input type="text" name="site_name" value="Accra HQ" maxlength="100">
      </div>
    </div>

    <div class="config-row">
      <div class="label">Active <small>Allow this user to sign in</small></div>
      <div class="control">
        <label class="toggle">
          <input type="checkbox" name="is_active" checked>
          <span class="track"></span>
          <span class="toggle-label">Account enabled</span>
        </label>
      </div>
    </div>

    <div class="config-row">
      <div class="label">First-time login <small>Force a password change on next sign-in</small></div>
      <div class="control">
        <label class="toggle">
          <input type="checkbox" name="first_time_login">
          <span class="track"></span>
          <span class="toggle-label">Pending</span>
        </label>
      </div>
    </div>

    <div class="config-actions">
      <span class="status">Last saved 2 minutes ago</span>
      <div class="spacer"></div>
      <a class="btn btn-ghost" href="index.html">Cancel</a>
      <button class="btn btn-primary" type="submit">Save configuration</button>
    </div>
  </form>
</main>

</body>
</html>
